<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>aethryla`s shop</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3f7;--pk:#f9c6d8;--dp:#e0678f;--tx:#5a2a3c;--mu:#a07a89}
*{box-sizing:border-box}
body{margin:0;font-family:Quicksand,system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:80px}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--pk);padding:10px 14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nm{font-family:Fredoka,Quicksand,sans-serif;font-weight:700;font-size:1.25rem;display:flex;align-items:center;gap:6px;cursor:pointer;margin-right:auto}
.stk{height:1.9em;width:auto;border-radius:6px}
.lk{background:none;border:1px solid var(--pk);border-radius:20px;padding:6px 12px;font:inherit;color:var(--tx);cursor:pointer}
main{max-width:760px;margin:0 auto;padding:14px}
.hero{width:100%;max-height:230px;object-fit:cover;border-radius:18px;border:3px solid #fff}
h2{font-size:1.1rem;margin:22px 0 10px}
.card{background:#fff;border:1px solid var(--pk);border-radius:16px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:12px;align-items:center}
.th{width:56px;height:56px;border-radius:12px;background:var(--pk);display:grid;place-items:center;font-size:1.6rem;flex:none}
.g{flex:1;min-width:0}.g small{color:var(--mu);display:block}
.pr{color:var(--dp);font-weight:700}
.btn{background:var(--dp);color:#fff;border:0;border-radius:20px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.o{background:#fff;color:var(--dp);border:1.5px solid var(--dp)}
.btn.s{padding:6px 12px}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
input,textarea,select{width:100%;font:inherit;color:var(--tx);padding:9px 12px;border:1px solid var(--pk);border-radius:12px;margin:4px 0 8px;background:#fff}
label{font-weight:700;font-size:.9rem}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--pk);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.stp{display:flex;align-items:center;gap:8px}.stp button{width:28px;height:28px;border-radius:50%;border:1px solid var(--dp);background:#fff;color:var(--dp);font-size:1rem;cursor:pointer}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.8rem;font-weight:700;background:var(--pk)}
.pill.delivered{background:#d6f5e0;color:#25663c}.pill.declined{background:#eee;color:#777}
.mod{position:fixed;inset:0;background:#5a2a3c66;display:grid;place-items:center;z-index:9;padding:14px}
.mod .card{width:100%;max-width:340px;margin:0}
.err{color:#c0305a;font-size:.9rem;min-height:1.2em}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.st{color:#f2a900;letter-spacing:2px}
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--tx);color:#fff;padding:8px 16px;border-radius:20px;z-index:10}
.qr{width:150px;height:150px;display:block;margin:8px auto;border:6px solid #fff;outline:1px solid var(--pk)}
.empty{text-align:center;color:var(--mu);padding:30px 0}
.cover{height:150px;border-radius:18px;background:var(--pk);position:relative;overflow:hidden}.cb{position:absolute;inset:-16px;background:center/cover;filter:blur(7px)}
.shead{display:flex;gap:12px;align-items:flex-end;margin:-34px 12px 8px;position:relative;z-index:2}
.av{width:76px;height:76px;border-radius:50%;border:4px solid #fff;object-fit:cover;background:#fff}
.sn{font-family:Fredoka,Quicksand,sans-serif;font-weight:700;font-size:1.3rem;display:flex;align-items:center;gap:6px}
.tbs{display:flex;border-bottom:1px solid var(--pk);margin-bottom:12px}
.tb{background:none;border:0;border-bottom:3px solid transparent;font:inherit;font-weight:700;padding:8px 14px;color:var(--mu);cursor:pointer}.tb.on{color:var(--tx);border-color:var(--dp)}
.srch{border-radius:24px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.pc{background:#fff;border:1px solid var(--pk);border-radius:14px;overflow:hidden;padding-bottom:10px}
.tile{aspect-ratio:1;background:linear-gradient(135deg,#fde4ee,#f9c6d8);display:grid;place-items:center;font-size:3.4rem;position:relative;cursor:pointer}.tile.big{border-radius:16px;font-size:6rem;margin-top:10px}
.hrt{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:#fff;color:var(--dp);font-size:1.2rem;cursor:pointer}
.pn{padding:8px 10px 2px;font-weight:700;font-size:.92rem;cursor:pointer}.pc .pr{padding:0 10px}.pc .btn{margin:8px 10px 0;width:calc(100% - 20px)}
.ava{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid #fff;outline:1px solid var(--pk);flex:none}
.ava.big{width:64px;height:64px}.ava.ph{display:grid;place-items:center;background:var(--pk);font-size:1.2rem}
.btn:disabled{opacity:.6;cursor:default}
</style></head><body><div id="app"></div>

async function api(path,method="GET",body){
  const r=await fetch("/api/"+path,{method,headers:{"content-type":"application/json",...(st.tok?{authorization:"Bearer "+st.tok.t}:{})},body:body?JSON.stringify(body):undefined});

}

async function go(v,buy){
  st.v=v;st.buy=buy||null;st.load=(v==="orders"||v==="owner");window.scrollTo(0,0);draw();
  try{
    if(v==="shop")st.pub=await api("reviews");

      st.orders=o;if(r)st.reviews=r;
    }
  }catch(e){if(!st.tok&&(v==="orders"||v==="owner")){st.v="shop";st.modal="auth"}}
  st.load=false;if(st.v===v)draw();
}

function chg(id,d){
  const l=st.buy?[st.buy]:st.cart,c=l.find(i=>i.id===id);c.q+=d;

}

async function place(){

}

  d.save();d.shadowColor="rgba(120,50,80,.28)";d.shadowBlur=22;d.shadowOffsetY=6;d.fillStyle="#fff";d.beginPath();d.moveTo(55,95);
  for(let k=55;k<=705;k+=12)d.lineTo(k,95+(k/12%2?0:7));for(let k=95;k<=H-30;k+=12)d.lineTo(705+(k/12%2?0:4),k);
  for(let k=705;k>=55;k-=12)d.lineTo(k,H-30-(k/12%2?0:7));for(let k=H-30;k>=95;k-=12)d.lineTo(55-(k/12%2?0:4),k);d.closePath();d.fill();d.restore();
  d.drawImage(t,0,0);
  if(stk){const hh=62,ww=hh*stk.width/stk.height;d.drawImage(stk,tEnd+8,124,ww,hh)}
  d.save();d.translate(W-390,40);d.rotate(-.07);d.fillStyle="#fbd3e0";d.fillRect(0,0,210,52);d.fillStyle="#7a3a52";d.font='italic 19px Georgia,serif';d.textAlign="center";d.fillText("pretty girls love pink!",105,32);d.restore();
  d.save();d.translate(W-118,98);d.strokeStyle="#f4f1f3";d.lineWidth=11;d.lineCap="round";d.beginPath();d.arc(0,0,44,Math.PI*1.02,Math.PI*1.98);d.stroke();
  d.strokeStyle="#cfc8cc";d.lineWidth=2;d.beginPath();d.arc(0,0,50,Math.PI*1.04,Math.PI*1.96);d.stroke();
  for(const sx of[-1,1]){d.fillStyle="#f6f3f5";d.strokeStyle="#cfc8cc";d.lineWidth=2;d.beginPath();d.ellipse(sx*45,12,14,24,0,0,7);d.fill();d.stroke();bow(d,sx*47,-8,9)}
  d.restore();
  if(pin){const w=88,h2=w*pin.height/pin.width;d.drawImage(pin,22,58,w,h2)}
  if(flw){const w=170,h2=w*flw.height/flw.width;d.drawImage(flw,W-w-8,H-h2+10,w,h2)}
  o.toBlob(bl=>{const a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download="invoice-"+x.id+".png";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)},"image/png");
  toast("Invoice downloaded");
}
const av=(p,c="")=>p?`<img class="ava ${c}" src="${p}" alt="">`:`<div class="ava ph ${c}">🌸</div>`;
function pickPic(inp){
  const f=inp.files[0];if(!f)return;
  const img=new Image(),url=URL.createObjectURL(f);
  img.onload=async()=>{
    const c=document.createElement("canvas");c.width=c.height=96;
    const s=Math.min(img.width,img.height);
    c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,96,96);
    URL.revokeObjectURL(url);
    const pic=c.toDataURL("image/jpeg",.75);
    try{await api("profile","POST",{pic});st.tok.pic=pic;sv();draw();toast("Photo updated")}catch(e){toast(e.message)}
  };
  img.onerror=()=>toast("Couldn’t read that photo.");
  img.src=url;
}
async function rate(id){
  try{await api(`orders/${id}/review`,"POST",{stars:document.getElementById("s"+id).value,text:document.getElementById("t"+id).value});go("orders");toast("Review sent")}
  catch(e){toast(e.message)}
}
function qr(){
  let s=7,r=()=>(s=s*16807%2147483647)/2147483647,o="";
  for(let y=0;y<25;y++)for(let x=0;x<25;x++){
    let on=r()>.5;
    for(const[a,b]of[[0,0],[18,0],[0,18]])if(x>=a&&x<a+7&&y>=b&&y<b+7){const dx=x-a,dy=y-b;on=dx%6==0||dy%6==0||(dx>1&&dx<5&&dy>1&&dy<5)}
    if(on)o+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg class="qr" viewBox="0 0 25 25" fill="#5a2a3c" role="img" aria-label="Dummy QR code">${o}</svg>`;
}
const stars=n=>"★".repeat(n)+"☆".repeat(5-n);
const date=t=>new Date(t).toLocaleString();
const lines=l=>full(l).map(i=>`${esc(i.n)} × ${i.q}`).join(", ");

const avg=()=>st.pub.length?(st.pub.reduce((s,r)=>s+r.stars,0)/st.pub.length).toFixed(1):"";
function grid(){
  const q=st.q.toLowerCase(),l=P.filter(p=>p.n.toLowerCase().includes(q));
  return l.length?l.map(p=>`<div class="pc"><div class="tile" onclick="openP('${p.id}')"><span>${p.e}</span><button class="hrt" onclick="event.stopPropagation();st.fav['${p.id}']=!st.fav['${p.id}'];draw()" aria-label="Favorite">${st.fav[p.id]?"♥":"♡"}</button></div>
  <div class="pn" onclick="openP('${p.id}')">${esc(p.n)}</div><div class="pr">${peso(p.p)}</div><button class="btn o s" onclick="add('${p.id}')">Add to cart</button></div>`).join(""):`<div class="empty">No items match your search.</div>`;
}
function reviewsList(){
  return st.pub.length?st.pub.map(r=>`<div class="card"><div class="row">${av(r.pic)}<div class="g"><span class="st">${stars(r.stars)}</span><small>@${esc(r.u)}</small></div></div><div>${esc(r.text)}</div></div>`).join(""):`<div class="empty">No reviews yet.</div>`;
}
function openP(id){st.pid=id;go("product")}
function product(){
  const p=P.find(x=>x.id===st.pid);
  return `<button class="lk" onclick="go('shop')">← Back to shop</button><div class="tile big" style="cursor:default"><span>${p.e}</span></div>
  <h2 style="margin:12px 0 2px">${esc(p.n)}</h2><div class="pr" style="font-size:1.4rem">${peso(p.p)}</div><p>${esc(p.d)}</p>
  <div class="btns"><button class="btn o" onclick="add('${p.id}')">Add to cart</button><button class="btn" onclick="go('checkout',{id:'${p.id}',q:1})">Buy it now</button></div>
  <p><small>Made to order. Pay with GCash at checkout.</small></p>`;
}
function shop(){
  const n=st.pub.length;
  const tabs=[["i","Items"],["r","Reviews"+(n?` (${n})`:"")],["a","About"]].map(([k,t])=>`<button class="tb ${st.pt===k?"on":""}" onclick="st.pt='${k}';draw()">${t}</button>`).join("");
  const c=st.pt==="r"?reviewsList():st.pt==="a"?`<div class="card"><b>About the shop</b><p>Custom Telegram sellers and buttons, made to order. Place your order, pay with GCash, and we’ll message you on Telegram.</p></div>`
   :`<input class="srch" placeholder="Search this shop" value="${esc(st.q)}" oninput="st.q=this.value;document.getElementById('gr').innerHTML=grid()"><div class="grid" id="gr">${grid()}</div>`;
  return `<div class="cover"><div class="cb" style="background-image:url(${LOGO})"></div></div>
  <div class="shead"><img class="av" src="${LOGO}" alt=""><div><div class="sn">${NAME} <img class="stk" src="${STK}" alt=""></div><small>${n?`★ ${avg()} · ${n} review${n>1?"s":""}`:"New shop"}</small></div></div>
  <div class="tbs">${tabs}</div>${c}`;
}
function cart(){
  if(!st.cart.length)return `<div class="empty">Your cart is empty.<div class="btns" style="justify-content:center"><button class="btn" onclick="go('shop')">Browse services</button></div></div>`;
  return `<h2>Your cart</h2>${stepList(st.cart)}
  <div class="bar"><div><small>Total</small><div class="pr">${peso(tot(st.cart))}</div></div><button class="btn" onclick="go('checkout')">Check out</button></div>`;
}
function stepList(l){
  return full(l).map(i=>`<div class="card row"><div class="th">${i.e}</div><div class="g"><b>${esc(i.n)}</b><span class="pr">${peso(i.p)}</span></div>
  <div class="stp"><button onclick="chg('${i.id}',-1)" aria-label="Fewer">−</button>${i.q}<button onclick="chg('${i.id}',1)" aria-label="More">+</button></div></div>`).join("");
}
function checkout(){
  const l=st.buy?[st.buy]:st.cart;
  if(!l.length)return cart();
  return `<h2>Checkout</h2>
  <div class="card"><label>Contact</label><input placeholder="Telegram username or number" value="${esc(st.f.c)}" oninput="st.f.c=this.value"></div>
  <h2 style="margin-top:6px">Order summary</h2>${stepList(l)}
  <div class="card"><div class="row"><span class="g">Subtotal</span>${peso(tot(l))}</div><div class="row"><span class="g">Fees</span>${peso(0)}</div><hr style="border:0;border-top:1px solid var(--pk)"><div class="row"><b class="g">Total</b><b class="pr">${peso(tot(l))}</b></div></div>
  <h2>Payment</h2>
  <div class="card"><b>GCash</b>${qr()}<div style="text-align:center"><small>Name: ${esc(CFG.gcashName)||"—"}<br>Number: ${esc(CFG.gcashNo)||"—"}</small></div>
  <label>Reference number</label><input placeholder="From your GCash receipt" value="${esc(st.f.r)}" oninput="st.f.r=this.value">
  <label>Notes for the seller</label><textarea rows="3" placeholder="What would you like made?" oninput="st.f.n=this.value">${esc(st.f.n)}</textarea></div>
  <div class="err">${esc(st.err)}</div>
  <div class="bar"><div><small>Total</small><div class="pr">${peso(tot(l))}</div></div><button class="btn" ${st.busy?"disabled":""} onclick="place()">${st.busy?"Placing order…":"Place order"}</button></div>`;
}
function orders(){
  const o=st.orders.slice().reverse();
  const head=st.tok?`<div class="card row">${av(st.tok.pic,"big")}<div class="g"><b>@${esc(st.tok.u)}</b><small>Your profile photo</small></div><label class="btn o s" style="cursor:pointer">Change photo<input type="file" accept="image/*" hidden onchange="pickPic(this)"></label></div>`:"";
  if(st.load)return head+`<div class="empty">Loading…</div>`;
  if(!o.length)return head+`<div class="empty">No orders yet.</div>`;
  return head+`<h2>My orders</h2>`+o.map(x=>`<div class="card"><div class="row"><b class="g">${peso(x.total)}</b><span class="pill ${x.status}">${L[x.status]}</span></div>
  <div>${lines(x.items)}</div><small>${date(x.at)}</small>
  <div class="btns"><button class="btn o s" onclick="invoice('${x.id}')">Download invoice</button></div>
  ${x.status==="delivered"&&!x.reviewed?`<div style="margin-top:10px"><label>Rate your order</label><select id="s${x.id}">${[5,4,3,2,1].map(n=>`<option value="${n}">${stars(n)}</option>`).join("")}</select><textarea id="t${x.id}" rows="2" placeholder="Tell us how it went"></textarea><button class="btn s" onclick="rate('${x.id}')">Send review</button></div>`:""}
  ${x.reviewed?`<small>Thanks for your review!</small>`:""}</div>`).join("");
}
function ownerView(){
  if(!owner())return `<div class="empty">Owner login required.</div>`;
  if(st.load)return `<div class="empty">Loading…</div>`;
  const tabs=`<div class="tabs"><button class="btn s ${st.tab==="o"?"":"o"}" onclick="st.tab='o';draw()">Orders</button><button class="btn s ${st.tab==="r"?"":"o"}" onclick="st.tab='r';draw()">Reviews</button></div>`;
  if(st.tab==="r")return tabs+(st.reviews.length?st.reviews.slice().reverse().map(r=>`<div class="card"><div class="row">${av(r.pic)}<div class="g"><span class="st">${stars(r.stars)}</span><small>@${esc(r.u)}</small></div></div><div>${esc(r.text)}</div>
  <div class="btns"><button class="btn s ${r.show?"o":""}" onclick="showR('${r.id}',${!r.show})">${r.show?"Hide from shop":"Show on shop"}</button></div></div>`).join(""):`<div class="empty">No reviews yet.</div>`);
  return tabs+(st.orders.length?st.orders.slice().reverse().map(x=>`<div class="card"><div class="row">${av(x.pic)}<b class="g">@${esc(x.u)} · ${peso(x.total)}</b><span class="pill ${x.status}">${L[x.status]}</span></div>
  <div>${lines(x.items)}</div><small>Contact: ${esc(x.contact)}<br>Ref: ${esc(x.ref)||"—"}<br>${esc(x.note)}<br>${date(x.at)}</small>
  <div class="btns"><button class="btn o s" onclick="invoice('${x.id}')">Invoice</button>${x.status==="pending"?`<button class="btn s" onclick="setS('${x.id}','processing')">Accept</button><button class="btn o s" onclick="setS('${x.id}','declined')">Decline</button>`:""}${x.status==="processing"?`<button class="btn s" onclick="setS('${x.id}','delivered')">Done</button>`:""}</div></div>`).join(""):`<div class="empty">No orders yet.</div>`);
}
function modal(){
  return `<div class="mod" onclick="if(event.target===this){st.modal=null;st.err='';draw()}"><div class="card"><b>Log in to continue</b><br><small>New here? Pick a username and password, then tap Create account.</small>
  <label for="u" style="display:block;margin-top:8px">Username</label><input id="u" autocomplete="username" value="${esc(st.au)}"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" value="${esc(st.ap)}">
  <div class="err">${esc(st.err)}</div><div class="btns"><button class="btn" ${st.busy?"disabled":""} onclick="auth('login')">${st.busy?"Please wait…":"Log in"}</button><button class="btn o" ${st.busy?"disabled":""} onclick="auth('register')">Create account</button></div></div></div>`;
}
function draw(){
  const n=st.cart.reduce((s,i)=>s+i.q,0);
  const body={shop,product,cart,checkout,orders,owner:ownerView}[st.v]();
  document.getElementById("app").innerHTML=`<header><div class="nm" onclick="go('shop')">${NAME} <img class="stk" src="${STK}" alt=""></div>
  ${st.tok&&st.tok.r!=="owner"?av(st.tok.pic):""}<button class="lk" onclick="go('cart')">🛒 ${n}</button>
  ${st.tok?`<button class="lk" onclick="go('${owner()?"owner":"orders"}')">${owner()?"Owner panel":"My orders"}</button><button class="lk" onclick="out()">Log out</button>`:`<button class="lk" onclick="st.modal='auth';draw()">Log in</button>`}</header>
  <main>${body}</main>${st.modal?modal():""}${st.msg?`<div class="toast">${esc(st.msg)}</div>`:""}`;
}
go("shop");
</script></body></html>
